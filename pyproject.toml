[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hidroclima-studio"
version = "1.0.0"
description = "HidroClima Studio: Suite de análisis hidrometeorológico, curvas IDF, balance hídrico, climatología ambiental e ingeniería de pavimentos"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "pperillav", email = "pperillav@unal.edu.co"}
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.13.0",
    "matplotlib>=3.8.0",
    "openpyxl>=3.1.2",
    "python-docx>=1.1.0",
    "fpdf2>=2.8.0",
    "requests>=2.31.0",
    "pillow>=10.0.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
    "pypdf>=4.0.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
hidroclima-studio = "hidroclima.launcher:main"

[tool.setuptools.packages.find]
include = ["hidroclima*"]

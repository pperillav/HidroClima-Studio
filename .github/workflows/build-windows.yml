name: Build, Test & Package HidroClima Studio

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run automated test suite
        run: pytest -v

  build-windows-release:
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime & PyInstaller dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Ensure Inno Setup 6 is available
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build Windows Installer (Setup.exe) and Portable ZIP
        run: python build_installer.py
      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HidroClimaStudio-Windows-Installer
          path: dist/HidroClimaStudio-Setup-*.exe
      - name: Upload Windows Portable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: HidroClimaStudio-Windows-Portable
          path: dist/HidroClimaStudio-*-Windows-Portable.zip
      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/HidroClimaStudio-Setup-*.exe
            dist/HidroClimaStudio-*-Windows-Portable.zip
